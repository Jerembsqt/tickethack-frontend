<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tickethack</title>
</head>
<body>
    <div id="container">
        <div id="header">
            <h1>Tickethack</h1>  
        </div>
        <div id="cart-bookings">
            <h4 class="cart"><a href="./cart.html" class="cart-link">cart</a></h4>
            <h4 class="bookings"><a href="./bookings.html" class="bookings-link">Bookings</a></h4> 
        </div>
        <div id="search">
                <input id="departure" type="text" placeholder="Departure">
                <input id="arrival" type="text" placeholder="arrival">
                <input id="date" type="date" placeholder="date">
                <button id="search-button">Search 🔎</button>
        </div>
        <div id="results">
            <img src="./images/train.png" alt="train" width="100px" height="100px">
            <h5>it's Time to book your journey</h5>
        </div>
    </div>
</body>
</html>
